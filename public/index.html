
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enterprise Cloud Service Catalog</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            width: 100%;
            padding: 50px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .tag {
            color: #93c5fd;
            letter-spacing: 2px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        .description {
            color: #cbd5e1;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .student {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .student p {
            margin: 10px;
            font-size: 17px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .services {
            background: #38bdf8;
            color: #0f172a;
        }

        .status {
            background: #34d399;
            color: #064e3b;
        }

        button:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        footer {
            margin-top: 30px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <p class="tag">CLOUD COMPUTING • PAAS APPLICATION</p>

        <h1>Enterprise Cloud Service Catalog</h1>

        <p class="description">
            Explore cloud computing services and monitor
            the operational status of this application
            through dedicated REST API endpoints.
        </p>

        <div class="student">
            <p><strong>Name:</strong> Dhrisya Boban</p>
            <p><strong>Roll Number:</strong> 2648022</p>
        </div>

        <div class="buttons">

            <button class="services"
                onclick="window.location.href='/api/services'">
                View Cloud Services
            </button>

            <button class="status"
                onclick="window.location.href='/api/status'">
                Check System Status
            </button>

        </div>

        <footer>
            Powered by Node.js, Express and Cloud PaaS
        </footer>

    </div>

</body>
</html>
